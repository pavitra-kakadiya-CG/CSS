
<!DOCTYPE html>
<html>
<head>
    <title>Ludo Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .board {
            width: min(90vw, 833px);
            aspect-ratio: 1;
            position: relative;
            border: 1px solid red;
        }

        .home {
            width: 40%;
            height: 40%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red {
            top: 0;
            left: 0;
            background: red;
        }

        .green {
            top: 0;
            right: 0;
            background: green;
        }

        .blue {
            bottom: 0;
            left: 0;
            background: blue;
        }

        .yellow {
            bottom: 0;
            right: 0;
            background: yellow;
        }

        .inner {
            width: 66.67%;
            height: 66.67%;
            background: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-content: space-evenly;
        }

        .circle {
            width: 25%;
            aspect-ratio: 1;
            border: 5px solid;
            border-radius: 50%;
        }

        .red .circle {
            border-color: red;
        }

        .green .circle {
            border-color: green;
        }

        .blue .circle {
            border-color: blue;
        }

        .yellow .circle {
            border-color: yellow;
        }

        .track {
            position: absolute;
            display: flex;
            flex-wrap: wrap;
        }

        .vertical {
            width: 20%;
            height: 40%;
            left: 40%;
        }

        .horizontal {
            width: 40%;
            height: 20%;
            top: 40%;
        }

        .top {
            top: 0;
        }

        .bottom {
            bottom: 0;
        }

        .left {
            left: 0;
        }

        .right {
            right: 0;
        }

        .vertical .cell {
            width: 33.3333%;
            height: 16.6667%;
        }

        .horizontal .cell {
            width: 16.6667%;
            height: 33.3333%;
        }

        .cell {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: clamp(12px, 2.8vw, 30px);
        }

        .green-bg {
            background: green;
        }

        .red-bg {
            background: red;
        }

        .blue-bg {
            background: blue;
        }

        .yellow-bg {
            background: yellow;
        }

        .center {
            width: 20%;
            height: 20%;
            position: absolute;
            top: 40%;
            left: 40%;
        }

        .triangle {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .t-green {
            background: green;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
        }

        .t-yellow {
            background: yellow;
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        }

        .t-blue {
            background: blue;
            clip-path: polygon(0 100%, 100% 100%, 50% 50%);
        }

        .t-red {
            background: red;
            clip-path: polygon(0 0, 0 100%, 50% 50%);
        }

    </style>
</head>

<body>

<div class="board">

    <div class="home red">
        <div class="inner">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>

    <div class="home green">
        <div class="inner">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>

    <div class="home blue">
        <div class="inner">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>

    <div class="home yellow">
        <div class="inner">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>

    <div class="track vertical top">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-bg"></div>
        <div class="cell green-bg">★</div>

        <div class="cell green-bg">★</div>
        <div class="cell green-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-bg"></div>
        <div class="cell"></div>
    </div>

    <div class="track vertical bottom">
        <div class="cell"></div>
        <div class="cell blue-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-bg"></div>
        <div class="cell blue-bg">★</div>

        <div class="cell blue-bg">★</div>
        <div class="cell blue-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-bg"></div>
        <div class="cell"></div>
    </div>

    <div class="track horizontal left">
        <div class="cell"></div>
        <div class="cell red-bg">★</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell red-bg"></div>
        <div class="cell red-bg"></div>
        <div class="cell red-bg"></div>
        <div class="cell red-bg"></div>
        <div class="cell red-bg"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell red-bg">★</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <div class="track horizontal right">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-bg">★</div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell yellow-bg"></div>
        <div class="cell yellow-bg"></div>
        <div class="cell yellow-bg"></div>
        <div class="cell yellow-bg"></div>
        <div class="cell yellow-bg"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-bg">★</div>
        <div class="cell"></div>
    </div>

    <div class="center">
        <div class="triangle t-green"></div>
        <div class="triangle t-yellow"></div>
        <div class="triangle t-blue"></div>
        <div class="triangle t-red"></div>
    </div>

</div>

</body>
</html>
